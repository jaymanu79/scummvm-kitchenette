# Builds of the Kitchenette fork (Director engine only), attached to each run:
#  - scummvm-kitchenette-deb: Ubuntu package, installs to /opt/scummvm-kitchenette
#  - scummvm-kitchenette-apk: Android debug APK (arm64-v8a), installs next to the official app
name: Kitchenette builds

on:
  push:
    branches: [master, kitchenette]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: 23.2.8568313
  ANDROID_API: 21
  ABI: arm64-v8a
  TRIPLE: aarch64-linux-android

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev zlib1g-dev libpng-dev libfreetype-dev

      - name: Configure
        run: |
          ./configure --prefix=/opt/scummvm-kitchenette \
            --disable-all-engines --enable-engine=director \
            --enable-release --disable-debug

      - name: Build
        run: make -j"$(nproc)"

      - name: Package
        run: |
          PKG="$PWD/pkg"
          make install DESTDIR="$PKG"
          mkdir -p "$PKG/usr/bin" "$PKG/DEBIAN"
          ln -s /opt/scummvm-kitchenette/bin/scummvm "$PKG/usr/bin/scummvm-kitchenette"
          VERSION="$(git log -1 --format=%cd --date=format:%Y%m%d).$(git rev-parse --short HEAD)"
          # dpkg-shlibdeps wants a debian/control file in the current directory
          mkdir -p /tmp/shlibs/debian && echo "Source: scummvm-kitchenette" > /tmp/shlibs/debian/control
          DEPENDS="$(cd /tmp/shlibs && dpkg-shlibdeps -O --ignore-missing-info -e "$PKG/opt/scummvm-kitchenette/bin/scummvm" | sed 's/^shlibs:Depends=//')"
          {
            echo "Package: scummvm-kitchenette"
            echo "Version: $VERSION"
            echo "Architecture: amd64"
            echo "Maintainer: jaymanu"
            echo "Depends: $DEPENDS"
            echo "Description: ScummVM fork for Kitchenette (Director engine only)"
            echo " Installs to /opt/scummvm-kitchenette, launched with scummvm-kitchenette."
            echo " Does not conflict with the official scummvm package."
          } > "$PKG/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$PKG" "scummvm-kitchenette_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v6
        with:
          name: scummvm-kitchenette-deb
          path: scummvm-kitchenette_*.deb
          if-no-files-found: error

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install the NDK version expected by build.gradle
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache third-party libraries
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: ~/android-deps
          key: android-deps-${{ env.NDK_VERSION }}-${{ env.ABI }}-freetype-2.13.3-libpng-1.6.44-oboe-1.11.0

      - name: Build FreeType, libpng and Oboe for Android
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          PREFIX="$HOME/android-deps"
          CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI -DANDROID_PLATFORM=$ANDROID_API -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON"
          cd /tmp
          curl -sSL https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz | tar xJ
          cmake -S freetype-2.13.3 -B ft-build $CMAKE_ARGS \
            -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_PNG=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON -DFT_REQUIRE_ZLIB=ON
          cmake --build ft-build -j"$(nproc)" --target install
          curl -sSL https://download.sourceforge.net/libpng/libpng-1.6.44.tar.xz | tar xJ
          cmake -S libpng-1.6.44 -B png-build $CMAKE_ARGS -DPNG_SHARED=OFF -DPNG_TESTS=OFF -DPNG_TOOLS=OFF
          cmake --build png-build -j"$(nproc)" --target install
          # Oboe: Android audio library required by the ScummVM Android mixer (same version as ScummVM's build images)
          curl -sSL https://github.com/google/oboe/archive/refs/tags/1.11.0.tar.gz | tar xz
          cmake -S oboe-1.11.0 -B oboe-build $CMAKE_ARGS
          cmake --build oboe-build -j"$(nproc)" --target install
          ls -R "$PREFIX/lib" | head -20

      - name: Configure
        run: |
          DEPS="$HOME/android-deps"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          # Oboe has no pkg-config file: point the compiler and linker at it directly
          export CXXFLAGS="-I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib -L$DEPS/lib/$ABI -lOpenSLES"
          ./configure --host=android-$ABI \
            --disable-all-engines --enable-engine=director \
            --enable-freetype2 --enable-png --enable-zlib \
            --disable-debug --enable-release

      - name: Build the APK
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v6
        with:
          name: scummvm-kitchenette-apk
          path: ScummVM-debug.apk
          if-no-files-found: error
